name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: 'pip'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Install Buildozer and build dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer==1.6.0 cython==0.29.34

      - name: Verify toolchain versions
        run: |
          python --version
          buildozer --version
          java -version

      - name: Clean previous Android build state
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dovam-samen-card-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
